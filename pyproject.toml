[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-driven-historical-geo"
version = "0.2.0"
description = "Auditable agentic workflow for inferring latent spatial structures from heterogeneous evidence"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "geopandas>=1.0",
  "jsonschema>=4.20",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pillow>=10",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "scikit-image>=0.22",
  "shapely>=2.0"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
historical-geo = "historical_geo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
historical_geo = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
